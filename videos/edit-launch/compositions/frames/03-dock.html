  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const FRAME_ID = "03-dock";
      const root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      const byId = (id) => document.getElementById(FRAME_ID + "-" + id);

      const camera = byId("camera");
      const files = byId("files");
      const filesEdge = byId("files-edge");

      // ISO POSE geometry (stage px)
      const PERSPECTIVE = 4200;
      const PERSPECTIVE_ORIGIN = { x: 960, y: 486 };
      const CAMERA_ORIGIN = { x: 960, y: 540 };
      const PLATE = { left: 280, top: 141, width: 1360, height: 798 };
      const ROTATE_X = (54 * Math.PI) / 180;
      const ROTATE_Z = (-38 * Math.PI) / 180;

      const HANDOFF_CAMERA = { x: 150, y: 20, scale: 1 };
      const ZOOM_SCALE = 1.18;
      // Where the editor's bottom half should sit at peak zoom (clear of the headline column)
      const ZOOM_GOAL = { x: 1180, y: 560 };

      // Plate-local point -> camera-space point (before the camera transform), z toward viewer
      function plateToCameraSpace(u, v) {
        const dx = PLATE.left + u - (PLATE.left + PLATE.width / 2);
        const dy = PLATE.top + v - (PLATE.top + PLATE.height / 2);
        const rx = dx * Math.cos(ROTATE_Z) - dy * Math.sin(ROTATE_Z);
        const ry = dx * Math.sin(ROTATE_Z) + dy * Math.cos(ROTATE_Z);
        return {
          x: CAMERA_ORIGIN.x + rx,
          y: CAMERA_ORIGIN.y + ry * Math.cos(ROTATE_X),
          z: ry * Math.sin(ROTATE_X),
        };
      }

      // Camera translate that projects a plate point onto `goal` at `scale`:
      // projected = PO + k * (C + T + S * (q - C) - PO), k = P / (P - z)
      function cameraTranslateFor(u, v, scale, goal) {
        const q = plateToCameraSpace(u, v);
        const k = PERSPECTIVE / (PERSPECTIVE - q.z);
        const solve = (axis) =>
          PERSPECTIVE_ORIGIN[axis] +
          (goal[axis] - PERSPECTIVE_ORIGIN[axis]) / k -
          CAMERA_ORIGIN[axis] -
          scale * (q[axis] - CAMERA_ORIGIN[axis]);
        return { x: solve("x"), y: solve("y") };
      }

      // Editor bottom half = drop zone, plate rect 410,399,680,378 -> center 750,588
      const zoomTranslate = cameraTranslateFor(750, 588, ZOOM_SCALE, ZOOM_GOAL);

      // Files layer starts at plate center 1225,399 (270x756)
      const FILES_W = 270;
      const FILES_H = 756;
      const HOVER = { x: 750 - 1225, y: 588 - 399, scaleX: 1.8, scaleY: 0.7 };
      const DOCKED = { x: 885 - 1225, y: 588 - 399, scaleX: 950 / FILES_W, scaleY: 378 / FILES_H };
      const LIFT_Z = 140;

      const tl = gsap.timeline({ paused: true });

      // Handoff state from frame 02
      tl.set(camera, { x: HANDOFF_CAMERA.x, y: HANDOFF_CAMERA.y, scale: HANDOFF_CAMERA.scale }, 0);
      tl.set(files, { x: 0, y: 0, z: 0, scaleX: 1, scaleY: 1, opacity: 1 }, 0);

      // Scene 1 (0.0–1.0): headline word by word
      root.querySelectorAll(".\\30 3-dock-word").forEach((word, i) => {
        tl.fromTo(
          word,
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          i * 0.25,
        );
      });

      // Scene 2 (1.0–2.0): Files lifts off, empty desktop beneath, camera starts its push
      tl.set(byId("patch"), { opacity: 1 }, 1.0);
      tl.to(files, { z: LIFT_Z, duration: 0.55, ease: "power3.out" }, 1.0);
      tl.to(filesEdge, { borderColor: "#3B8EEA", duration: 0.2, ease: "power1.out" }, 1.0);
      tl.to(
        camera,
        {
          x: zoomTranslate.x,
          y: zoomTranslate.y,
          scale: ZOOM_SCALE,
          duration: 2.0,
          ease: "power2.inOut",
        },
        1.0,
      );

      // Scene 3 (2.0–3.0): base cuts to the real drop zone, window glides over it
      tl.set(byId("base-drag"), { opacity: 1 }, 2.0);
      tl.set(byId("dropzone"), { opacity: 1 }, 2.0);
      tl.to(
        files,
        {
          x: HOVER.x,
          y: HOVER.y,
          scaleX: HOVER.scaleX,
          scaleY: HOVER.scaleY,
          duration: 0.9,
          ease: "power2.inOut",
        },
        2.0,
      );
      tl.to(byId("pulse"), { opacity: 1, duration: 0.15, ease: "power2.out" }, 2.5);
      tl.to(byId("pulse"), { opacity: 0, duration: 0.35, ease: "power2.in" }, 2.65);

      // Scene 4 (3.0–3.5): DROP — morph into the docked region, base cuts to dropped state
      const DROP_AT = 3.0;
      const MORPH_DUR = 0.25;
      tl.set(byId("base-dropped"), { opacity: 1 }, DROP_AT);
      tl.set(byId("dropzone"), { opacity: 0 }, DROP_AT);
      tl.set(byId("patch"), { opacity: 0 }, DROP_AT);
      tl.set(byId("edges-before"), { opacity: 0 }, DROP_AT);
      tl.set(byId("edges-after"), { opacity: 1 }, DROP_AT);
      tl.to(
        files,
        {
          x: DOCKED.x,
          y: DOCKED.y,
          z: 0,
          scaleX: DOCKED.scaleX,
          scaleY: DOCKED.scaleY,
          duration: MORPH_DUR,
          ease: "power2.inOut",
        },
        DROP_AT,
      );
      tl.to(
        byId("files-old"),
        { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" },
        DROP_AT,
      );
      tl.to(
        byId("files-new"),
        { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out" },
        DROP_AT + MORPH_DUR * 0.6,
      );
      tl.to(
        files,
        { opacity: 0, duration: MORPH_DUR * 0.2, ease: "power1.in", immediateRender: false },
        DROP_AT + MORPH_DUR,
      );

      // Accent border flash on the docked Files window
      tl.fromTo(
        byId("flash"),
        { opacity: 0, scale: 1.03 },
        { opacity: 1, scale: 1, duration: 0.12, ease: "power3.out" },
        DROP_AT + MORPH_DUR - 0.05,
      );
      tl.to(
        byId("flash"),
        { opacity: 0, duration: 0.13, ease: "power1.in" },
        DROP_AT + MORPH_DUR + 0.07,
      );

      // Scene 5 (3.5–6.0): camera eases back out, lead line lands, hold
      tl.to(
        camera,
        {
          x: HANDOFF_CAMERA.x,
          y: HANDOFF_CAMERA.y,
          scale: HANDOFF_CAMERA.scale,
          duration: 1.0,
          ease: "power3.inOut",
        },
        3.5,
      );
      tl.fromTo(
        byId("lead"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.0,
      );

      tl.set({}, {}, 6.0);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
