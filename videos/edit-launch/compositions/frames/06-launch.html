  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const FRAME_ID = "06-launch";
      const DURATION = 6;
      const BEAT = 0.5;
      const QUARTER = BEAT / 4;

      const T_IMPACT = 1.0;
      const T_BLINK_START = 2.0;
      const T_KICKER = 2.0;
      const T_LEAD = 2.5;
      const T_PILL = 3.5;
      const T_EXIT = 5.5;

      const el = (suffix) => document.getElementById(`${FRAME_ID}-${suffix}`);

      const plates = [
        { node: el("plate-empty"), x: -900, y: -320, rotation: -28 },
        { node: el("plate-assistant"), x: 880, y: -330, rotation: 24 },
        { node: el("plate-zoom"), x: 920, y: 400, rotation: -22 },
        { node: el("plate-files"), x: -930, y: 400, rotation: 30 },
      ];
      const rule = el("rule");
      const kicker = el("kicker");
      const wordmark = el("wordmark");
      const wordText = el("word-text");
      const cursor = el("cursor");
      const lead = el("lead");
      const pill = el("pill");
      const prompt = el("prompt");
      const command = el("command");
      const caret = el("caret");

      const KEYS = ["$", "$ ", "$ e", "$ ed", "$ edi", "$ edit"];
      const TYPE_SEQUENCE = [{ t: 0, text: "" }].concat(
        KEYS.map((text, i) => ({ t: T_PILL + i * QUARTER, text })),
      );
      const T_TYPED = TYPE_SEQUENCE[TYPE_SEQUENCE.length - 1].t;

      function typedTextAt(time) {
        for (let i = TYPE_SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= TYPE_SEQUENCE[i].t) return TYPE_SEQUENCE[i].text;
        }
        return "";
      }

      function isOnBeat(time, since) {
        return (time - since) % BEAT < BEAT / 2;
      }

      function render(time) {
        const typed = typedTextAt(time);
        prompt.textContent = typed.slice(0, 1);
        command.textContent = typed.slice(1);

        const caretSolid = time < T_TYPED + BEAT;
        caret.style.opacity = caretSolid || isOnBeat(time, T_TYPED + BEAT) ? "1" : "0";

        const cursorSolid = time < T_BLINK_START || time >= T_EXIT;
        cursor.style.opacity = cursorSolid || isOnBeat(time, T_BLINK_START) ? "1" : "0";
      }

      const tl = gsap.timeline({ paused: true });

      // Scene 1 — the window plates implode into the center, accelerating, and vanish at the downbeat.
      plates.forEach((plate) => {
        tl.fromTo(
          plate.node,
          { x: plate.x, y: plate.y, rotation: 0, scale: 1 },
          { x: 0, y: 0, rotation: plate.rotation, scale: 0.03, duration: T_IMPACT, ease: "power3.in" },
          0,
        );
        tl.fromTo(
          plate.node,
          { filter: "blur(0px)" },
          { filter: "blur(8px)", duration: 0.5, ease: "power2.in" },
          0.5,
        );
        tl.fromTo(plate.node, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power1.in" }, 0.85);
      });

      // Scene 2 — the wordmark slams in on the downbeat; the rule stub snaps open above it.
      tl.fromTo(
        wordmark,
        { scale: 1.5, filter: "blur(16px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
        T_IMPACT,
      );
      tl.fromTo(
        rule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "expo.out" },
        T_IMPACT + QUARTER,
      );

      // Scene 3 — kicker side-snaps in, then the lead rises in below the wordmark.
      tl.fromTo(
        kicker,
        { x: -80, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
        T_KICKER,
      );
      tl.fromTo(
        lead,
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
        T_LEAD,
      );

      // Scene 4 — the terminal pill pops in and "$ edit" types one key per quarter-beat.
      tl.fromTo(
        pill,
        { y: 24, scale: 0.92, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" },
        T_PILL,
      );

      const driver = { t: 0 };
      tl.to(
        driver,
        { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => render(driver.t) },
        0,
      );

      // Scene 5 — the lockup fades to the ground; the accent block cursor stays lit to the last frame.
      tl.fromTo(
        [rule, kicker, wordText, lead, pill],
        { opacity: 1 },
        { opacity: 0, duration: DURATION - T_EXIT, ease: "power2.inOut", immediateRender: false },
        T_EXIT,
      );

      render(0);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
