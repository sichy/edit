    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const FRAME_ID = "04-assistant";
        const byId = (suffix) => document.getElementById(FRAME_ID + "-" + suffix);

        const world = byId("world");
        const shotEmpty = byId("shot-empty");
        const shotChip = byId("shot-chip");
        const shotMode = byId("shot-mode");
        const shotModel = byId("shot-model");
        const chipHole = byId("chip-hole");
        const chipPop = byId("chip-pop");
        const cover1 = byId("cover-1");
        const cover2 = byId("cover-2");
        const caret = byId("caret");
        const sendCover = byId("send-cover");
        const sendHole = byId("send-hole");
        const sendLit = byId("send-lit");
        const leadMode = byId("lead-mode");
        const leadModel = byId("lead-model");

        // Beat map (seconds)
        const T_CHIP = 1.0;
        const T_TYPE_START = 1.5;
        const T_TYPE_END = 3.25;
        const T_SEND = 3.5;
        const T_MODE = 4.0;
        const T_MODEL = 5.0;

        // Prompt geometry in source px of the composer crop (20px per monospace char)
        const CHAR_W = 20;
        const TEXT_X = 80;
        const TEXT_RIGHT = 660;
        const LINE_1_CHARS = 29;
        const LINE_2_CHARS = 27;
        const CHAR_DUR = (T_TYPE_END - T_TYPE_START) / (LINE_1_CHARS + LINE_2_CHARS);
        const T_LINE_2 = T_TYPE_START + LINE_1_CHARS * CHAR_DUR;
        const LINE_1_CARET_Y = 208;
        const LINE_2_CARET_Y = 250;

        const BLINK_HALF = 0.3;
        const CARET_IDLE_COLOR = "#3B8EEA";
        const CARET_TYPING_COLOR = "#D4D4D4";

        const SHOWN = { visibility: "visible" };
        const HIDDEN = { visibility: "hidden" };
        const chipStateOverlays = [chipHole, chipPop, cover1, cover2];

        const tl = gsap.timeline({ paused: true });

        // Hard-cut composer states, always on the beat
        tl.set(shotEmpty, SHOWN, 0);
        tl.set([shotChip, shotMode, shotModel], HIDDEN, 0);
        tl.set(chipStateOverlays.concat([caret, sendCover, sendHole, sendLit]), HIDDEN, 0);
        tl.set([leadMode, leadModel], HIDDEN, 0);

        tl.set(shotEmpty, HIDDEN, T_CHIP);
        tl.set(shotChip, SHOWN, T_CHIP);
        tl.set(chipStateOverlays.concat([sendCover]), SHOWN, T_CHIP);

        tl.set([sendCover], HIDDEN, T_SEND);
        tl.set([sendHole, sendLit], SHOWN, T_SEND);

        tl.set(shotChip, HIDDEN, T_MODE);
        tl.set(shotMode, SHOWN, T_MODE);
        tl.set(chipStateOverlays.concat([caret, sendHole, sendLit]), HIDDEN, T_MODE);
        tl.set(leadMode, SHOWN, T_MODE);

        tl.set(shotMode, HIDDEN, T_MODEL);
        tl.set(shotModel, SHOWN, T_MODEL);
        tl.set(leadMode, HIDDEN, T_MODEL);
        tl.set(leadModel, SHOWN, T_MODEL);

        // Scene 1 — camera push-in settles on the composer by 0.75s
        tl.fromTo(world, { scale: 0.9 }, { scale: 1, duration: 0.75, ease: "expo.out" }, 0);

        // Scene 1 — h2 reveals word group by word group
        ["w1", "w2", "w3"].forEach((suffix, i) => {
          tl.fromTo(
            byId(suffix),
            { yPercent: 105 },
            { yPercent: 0, duration: 0.5, ease: "power3.out" },
            0.25 + i * 0.25,
          );
        });

        // Scene 2 — dock.rs chip spring-pops in
        tl.fromTo(
          chipPop,
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          T_CHIP,
        );

        // Scene 3 — the prompt types: covers step right one character at a time, caret leads
        // Covers shrink toward their right edge (transform-origin 100%), so each step uncovers one character
        const TEXT_WIDTH = TEXT_RIGHT - TEXT_X;
        tl.set(cover2, { scaleX: 1 }, 0);
        tl.fromTo(
          cover1,
          { scaleX: 1 },
          {
            scaleX: 0,
            duration: LINE_1_CHARS * CHAR_DUR,
            ease: "steps(" + LINE_1_CHARS + ")",
          },
          T_TYPE_START,
        );
        tl.fromTo(
          cover2,
          { scaleX: 1 },
          {
            scaleX: 1 - (LINE_2_CHARS * CHAR_W) / TEXT_WIDTH,
            duration: LINE_2_CHARS * CHAR_DUR,
            ease: "steps(" + LINE_2_CHARS + ")",
            immediateRender: false,
          },
          T_LINE_2,
        );
        tl.fromTo(
          caret,
          { x: 0, y: 0 },
          {
            x: LINE_1_CHARS * CHAR_W,
            duration: LINE_1_CHARS * CHAR_DUR,
            ease: "steps(" + LINE_1_CHARS + ")",
          },
          T_TYPE_START,
        );
        tl.set(caret, { x: 0, y: LINE_2_CARET_Y - LINE_1_CARET_Y }, T_LINE_2);
        tl.to(
          caret,
          {
            x: LINE_2_CHARS * CHAR_W,
            duration: LINE_2_CHARS * CHAR_DUR,
            ease: "steps(" + LINE_2_CHARS + ")",
          },
          T_LINE_2,
        );

        // Caret: accent while idle, cream while typing; solid while typing, blinking when idle
        tl.set(caret, { backgroundColor: CARET_IDLE_COLOR }, 0);
        tl.set(caret, { backgroundColor: CARET_TYPING_COLOR }, T_TYPE_START);
        tl.set(caret, { backgroundColor: CARET_IDLE_COLOR }, T_TYPE_END + 0.1);
        const idleWindows = [
          [T_CHIP, T_TYPE_START],
          [T_TYPE_END + 0.1, T_MODE],
        ];
        idleWindows.forEach(([from, to]) => {
          let on = true;
          for (let t = from; t < to - 1e-6; t += BLINK_HALF) {
            tl.set(caret, on ? SHOWN : HIDDEN, t);
            on = !on;
          }
        });
        tl.set(caret, SHOWN, T_TYPE_START);

        // Scene 3 — send button lights and press-pops
        tl.fromTo(sendLit, { scale: 1 }, { scale: 0.92, duration: 0.08, ease: "power2.in" }, T_SEND);
        tl.to(sendLit, { scale: 1, duration: 0.35, ease: "power3.out" }, T_SEND + 0.08);

        // Scene 3 — slow push toward the input under the typing, then locked to the end
        tl.to(world, { scale: 1.025, duration: 2.0, ease: "sine.inOut" }, T_TYPE_START);

        // Pin the timeline length to the frame duration
        tl.set({}, {}, 6);

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
      })();
    </script>
