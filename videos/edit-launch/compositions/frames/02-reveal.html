    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const FRAME_ID = "02-reveal";
        const DURATION = 4;
        const byId = (name) => document.getElementById(`${FRAME_ID}-${name}`);

        const open = byId("open");
        const flash = byId("flash");
        const crtLine = byId("crt-line");
        const camera = byId("camera");
        const iso = byId("iso");
        const menubar = byId("menubar");
        const statusbar = byId("statusbar");
        const assistant = byId("assistant");
        const editor = byId("editor");
        const files = byId("files");
        const editorAccent = byId("editor-accent");
        const year = byId("year");
        const headline = byId("headline");
        const kickerGroup = byId("kicker-group");
        const title = byId("title");

        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–0.5s): CRT line opens vertically into the flat, full-bleed screen.
        const LINE_SCALE = 4 / 1080;
        tl.fromTo(open, { scaleY: LINE_SCALE }, { scaleY: 1, duration: 0.3, ease: "expo.out" }, 0);
        tl.fromTo(flash, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 0);
        tl.fromTo(crtLine, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power1.out" }, 0);

        // Year label: discrete state, hard cut at 0.0.
        const YEAR_SEQUENCE = [{ t: 0, text: "2026" }];
        const yearAt = (time) => {
          for (let i = YEAR_SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= YEAR_SEQUENCE[i].t) return YEAR_SEQUENCE[i].text;
          }
          return "";
        };

        // Scene 2 (0.5–1.5s): one decelerating pull-back while the plate tilts into the ISO POSE.
        // A single driver is the only writer of the camera and plate transforms.
        const PULL_AT = 0.5;
        const PULL_DUR = 1.0;
        const pullEase = gsap.parseEase("power4.out");
        const CAM_FROM = { scale: 1.42, x: 0, y: 0 };
        const CAM_TO = { scale: 1, x: 150, y: 20 };
        const ISO_TO = { rotateX: 54, rotateZ: -38 };

        const clamp01 = (v) => Math.min(1, Math.max(0, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const round = (v) => Math.round(v * 10000) / 10000;

        function renderAt(time) {
          const p = pullEase(clamp01((time - PULL_AT) / PULL_DUR));
          const scale = round(lerp(CAM_FROM.scale, CAM_TO.scale, p));
          const x = round(lerp(CAM_FROM.x, CAM_TO.x, p));
          const y = round(lerp(CAM_FROM.y, CAM_TO.y, p));
          camera.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
          iso.style.transform = `rotateX(${round(ISO_TO.rotateX * p)}deg) rotateZ(${round(ISO_TO.rotateZ * p)}deg)`;
          year.textContent = yearAt(time);
        }

        const driver = { t: 0 };
        renderAt(0);
        tl.to(driver, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => renderAt(driver.t) }, 0);

        // Scene 3 (1.5–2.5s): the windows explode upward in depth layers on the beats.
        const strips = [menubar, statusbar];
        const sideWindows = [assistant, files];
        const allLayers = [...strips, ...sideWindows, editor];
        gsap.set(allLayers, { z: 0 });

        tl.fromTo(strips, { z: 0 }, { z: 40, duration: 0.5, ease: "power3.out" }, 1.5);
        tl.fromTo(sideWindows, { z: 0 }, { z: 110, duration: 0.6, ease: "expo.out", stagger: 0.04 }, 2.0);
        tl.fromTo(editor, { z: 0 }, { z: 170, duration: 0.7, ease: "back.out(1.4)" }, 2.0);
        tl.fromTo(editorAccent, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.0);

        // Scene 4: left headline slams in on the beats, each with its own entrance.
        tl.fromTo(
          kickerGroup,
          { x: -320, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
          2.5,
        );
        tl.fromTo(
          title,
          { scale: 1.5, filter: "blur(16px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
          3.0,
        );

        // Scene 5 (3.5–4.0s): layers drop back flat with a tiny settle; headline hard-cuts out.
        // Chained tweens on already-animated props must not render their from-state at build time.
        const DROP_AT = 3.5;
        const chained = { immediateRender: false };
        tl.fromTo(strips, { z: 40 }, { ...chained, z: 0, duration: 0.2, ease: "power3.in" }, DROP_AT);
        tl.fromTo(sideWindows, { z: 110 }, { ...chained, z: 0, duration: 0.2, ease: "power3.in" }, DROP_AT);
        tl.fromTo(editor, { z: 170 }, { ...chained, z: 0, duration: 0.2, ease: "power3.in" }, DROP_AT);
        tl.fromTo(editorAccent, { opacity: 1 }, { ...chained, opacity: 0, duration: 0.2, ease: "power2.in" }, DROP_AT);
        tl.fromTo(allLayers, { z: 0 }, { ...chained, z: 8, duration: 0.1, ease: "power2.out" }, DROP_AT + 0.2);
        tl.fromTo(allLayers, { z: 8 }, { ...chained, z: 0, duration: 0.15, ease: "power2.in" }, DROP_AT + 0.3);
        tl.set(headline, { opacity: 0 }, 3.75);

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
      })();
    </script>
